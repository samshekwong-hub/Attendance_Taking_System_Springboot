<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" http-equiv="Content-Type" content="text/html" />
    <title>Student Tutoring</title>
    <link th:href="@{/styles/main.css}" rel="stylesheet" />
  </head>
  <body>
    <div class="container" id="add_container">
      <h2>Add a Student</h2>

      <div class="form-contents">
        <form
          action="#"
          th:action="@{/add}"
          th:object="${student}"
          method="post"
        >
          <div class="login-input-container">
            <p>
              Name:
              <input
                type="text"
                name=""
                id=""
                class="input_field"
                th:field="*{name}"
              />
            </p>
          </div>
          <div class="login-input-container">
            <p>
              Class:
              <input
                type="text"
                name=""
                id=""
                class="input_field"
                th:field="*{studentClass}"
              />
            </p>
          </div>
          <div class="submit-reset-container">
            <p><button class="submit" type="submit">Submit</button></p>
            <p><button class="reset" type="reset">Reset</button></p>
          </div>
        </form>
        <form action="/check">
          <button type="submit" class="check-status">
            Check Student Status
          </button>
        </form>
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="check-status logout">logout</button>
        </form>
      </div>
    </div>

    <script th:inline="javascript">
      var message = /*[[${message}]]*/ null;

      if (message) {
        if (message === "EMPTY") {
          alert("name or class was not filled");
        } else if (message === "DUPLICATE") {
          alert("This student was already added to database");
        } else if (message.startsWith("SUCCESS:")) {
          var parts = message.split(":");
          var name = parts[1];
          var studentClass = parts[2];
          alert(
            "Student added (name: " + name + ", Class: " + studentClass + ") ",
          );
        }
      }
    </script>
  </body>
</html>
