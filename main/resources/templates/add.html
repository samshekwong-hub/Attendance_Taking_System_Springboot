<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" http-equiv="Content-Type" content="text/html" />
    <title>Student Tutoring</title>
  </head>
  <body>
    <div class="container" id="add_container">
      <h1>Add a Student</h1>
      <form action="#" th:action="@{/add}" th:object="${student}" method="post">
        <p>
          Name:
          <input
            type="text"
            name=""
            id=""
            class="input_field"
            th:field="*{name}"
          />
        </p>
        <p>
          Class:
          <input
            type="text"
            name=""
            id=""
            class="input_field"
            th:field="*{student_class}"
          />
        </p>
        <p><input type="submit" value="submit" /></p>
        <p><input type="reset" value="Reset" /></p>
      </form>
    </div>

    <a href="/check">Check Student Status</a>

    <script th:inline="javascript">
      var message = /*[[${message}]]*/ null;

      if (message) {
        if (message === "EMPTY") {
          alert("name or class was not filled");
        } else if (message === "DUPLICATE") {
          alert("This student was already added to database");
        } else if (message.startsWith("SUCCESS:")) {
          var parts = message.split(":");
          var name = parts[1];
          var studentClass = parts[2];
          alert(
            "Student added (name: " + name + ", Class: " + studentClass + ") ",
          );
        }
      }
    </script>
  </body>
</html>
