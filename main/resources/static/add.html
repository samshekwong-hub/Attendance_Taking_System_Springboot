<!doctype html>
<html lang="en" xmlns="https://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" http-equiv="Content-Type" content="text/html" />
    <title>Student Tutoring</title>
  </head>
  <body>
    <div class="container" id="add_container">
      <h1>Add a Student</h1>
      <form
        action="#"
        th:action="@{/add}"
        th:object="${student}"
        method="post"
      >
        <p>
          Name:
          <input
            type="text"
            name=""
            id=""
            class="input_field"
            th:field="*{name}"
          />
        </p>
        <p>
          Class:
          <input
            type="text"
            name=""
            id=""
            class="input_field"
            th:field="*{student_class}"
          />
        </p>
        <p><input type="submit" value="submit" /></p>
        <p><input type="reset" value="Reset" /></p>
      </form>
    </div>
  </body>
</html>
