<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Student Tutoring</title>
  </head>
  <body>
    <div class="container" id="table-container">
      <table>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Class</th>
          <th>Attendance Count</th>
          <th>Approved Ask for Leave</th>
        </tr>
        <tr th:each="student: ${students}">
          <td th:text="${student.id}" />
          <td th:text="${student.name}" />
          <td th:text="${student.student_class}" />
          <td th:text="${student.attendance_count}" />
          <td th:text="${student.ask_leave_count}" />
          <td>
            <form
              action=""
              th:action="@{/remove/{id}(id=${student.id})}"
              method="post"
            >
              <button type="submit">-</button>
            </form>
          </td>
        </tr>
      </table>

      <a href="/add">Back</a>
    </div>
  </body>
</html>
